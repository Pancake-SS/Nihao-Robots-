name: ni_hao_robot
description: A local-first Mandarin learning companion with offline profiles.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter_tts: 4.2.5
  crypto: 3.0.8
  audioplayers: 6.8.1
  characters: ^1.4.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/robots/
    - assets/branding/
    - assets/ui_art/
    - assets/content/curriculum.sqlite
    - assets/content/curriculum.manifest.json
    - assets/content/grammar_v1.json
    - assets/content/classics_v1.json
    - assets/content/GRAMMAR_ATTRIBUTION.txt
    - assets/audio/
    - assets/content/starter_greeting_v2.json
    - assets/content/starter_imported_v1.json
    - assets/content/dictionary_v1.json
    - assets/content/ATTRIBUTION.txt
    - assets/content/LICENSE-CC-BY-SA-4.0.txt
    - assets/content/LICENSE-CC-BY-4.0.txt
    - assets/mascots/welcome_waving_light.png
    - assets/mascots/welcome_orb_dark.png
    - assets/mascots/profile_tracked_light.png
    - assets/mascots/vocabulary_goggles_light.png
    - assets/mascots/foundation_orb_light.png
    - assets/mascots/vocabulary_hover_light.png
