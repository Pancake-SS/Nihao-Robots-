name: ni_hao_robot
description: A local-first Mandarin learning companion with offline profiles.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  characters: ^1.4.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mascots/welcome_waving_light.png
    - assets/mascots/welcome_orb_dark.png
    - assets/mascots/profile_tracked_light.png
